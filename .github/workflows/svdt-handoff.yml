name: SVDT — místní Claude handoff

on:
  pull_request:
    paths:
      - "event-app/tools/claude_handoff.py"
      - "event-app/tools/review_receipt.py"
      - "event-app/tests/claude_handoff_test.py"
      - "event-app/tests/review_receipt_test.py"
      - "event-app/tools/crew_workspace.py"
      - "event-app/tests/crew_workspace_test.py"
      - "event-app/tests/crew_csv_test.cjs"
      - "event-app/tests/crew_snapshot_host_test.py"
      - "event-app/tests/crew_snapshot_io_host_test.py"
      - "event-app-zadani/wireframes/**"
      - ".github/workflows/svdt-handoff.yml"
  push:
    branches: [main]
    paths:
      - "event-app/tools/claude_handoff.py"
      - "event-app/tools/review_receipt.py"
      - "event-app/tests/claude_handoff_test.py"
      - "event-app/tests/review_receipt_test.py"
      - "event-app/tools/crew_workspace.py"
      - "event-app/tests/crew_workspace_test.py"
      - "event-app/tests/crew_csv_test.cjs"
      - "event-app/tests/crew_snapshot_host_test.py"
      - "event-app/tests/crew_snapshot_io_host_test.py"
      - "event-app-zadani/wireframes/**"
      - ".github/workflows/svdt-handoff.yml"

permissions:
  contents: read

jobs:
  synthetic-host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ověřit hostitelské kontroly na fiktivních datech
        run: python3 -B -m unittest discover -s event-app/tests -p '*_test.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ověřit syntaxi veřejného rozhraní
        run: |
          node --check event-app-zadani/wireframes/crew-csv.js
          node --check event-app-zadani/wireframes/crew-sheet.js
          node --check event-app-zadani/wireframes/crew-workspace.js
          node --check event-app-zadani/wireframes/crew-review.js
          node --check event-app-zadani/wireframes/prototype.js
      - name: Ověřit CSV serializaci na fiktivních datech
        run: node --test event-app/tests/crew_csv_test.cjs
