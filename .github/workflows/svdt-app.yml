name: SVDT — aplikace a databázová pravidla
on:
  pull_request:
    paths: ['event-app/**', 'design-system/tokens/**', '.github/workflows/svdt-app.yml']
  push:
    branches: [main]
    paths: ['event-app/**', 'design-system/tokens/**', '.github/workflows/svdt-app.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: event-app
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: event-app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
